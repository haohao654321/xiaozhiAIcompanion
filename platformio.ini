; ============================================================
;  AI Desktop Companion — ESP32-S3 N16R8
;  多模态桌面情感伴侣主项目
; ============================================================

[platformio]
; 构建输出放到纯 ASCII 路径 — 项目目录含中文"视觉AI项目workbuddy"，
; xtensa 工具链 (gcc 8.4.0) 在 Windows 下无法在中文路径创建 firmware.map，
; 链接阶段报 "cannot open map file"。此为已知工具链缺陷。
build_dir = C:/Users/123/esp32s3-companion-build

[env:esp32s3-companion]
platform          = espressif32@^6.7.0
board             = esp32-s3-devkitc-1
framework         = arduino

; ---- 内存类型：八进制 PSRAM (N16R8) ----
board_build.arduino.memory_type = dio_opi

; ---- Flash & 分区 ----
board_upload.flash_size         = 16MB
board_build.partitions          = partitions_custom.csv

; ---- 串口 ----
monitor_speed     = 115200
upload_speed      = 921600
; upload_port     = COM5    ; 按实际端口修改
; monitor_port    = COM5

; ---- 编译参数 ----
build_flags =
    -DBOARD_HAS_PSRAM
    -DBOARD_HAS_SPIRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; 摄像头引脚由 board_config.h 定义，不需要此处重复
    ; 调试日志
    -DCORE_DEBUG_LEVEL=1
    ; P7a: ESP-DL (人脸检测/识别) 需要 C++17 (std::list/std::vector/template)
    -std=gnu++17

; ---- P4-1: esp-sr 预编译静态库链接 (wakenet) ----
extra_scripts = tools/link_espsr.py

; ---- 库依赖 ----
; P1: 摄像头驱动内置于 ESP32 框架，无需额外 lib_dep
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.5
    ; 注意: 锁定 1.4.9 版本 — 1.5+ 需要新 core 的 esp32-hal-periman.h，当前 core 3.0.7 没有
    moononournation/GFX Library for Arduino @ 1.4.9
    ; P4: JSON 解析 (STT/LLM/TTS API 响应)
    bblanchon/ArduinoJson @ ^7.0.0
    ; P4 后续: ESP8266Audio (MP3 解码播放 TTS 返回音频)

; ---- 监视器换行 ----
monitor_filters = esp32_exception_decoder
